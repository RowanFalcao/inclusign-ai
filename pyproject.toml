[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inclusign-ai"
version = "1.0.0"
description = "Plataforma de Agentes de Inteligência Artificial para Inclusão Educacional e Tradução em Libras"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rowan Falcão Rodrigues Lopes da Silva" },
    { name = "Wayrone Klaiton Luiz Silva" },
    { name = "Edina Ferreira Martins Falcão Lopes" },
    { name = "Flávio Silva de Oliveira" },
    { name = "Fabiana Girotto Ribeiro" }
]
keywords = [
    "artificial-intelligence",
    "accessibility",
    "libras",
    "special-education",
    "rag",
    "multi-agent",
    "ollama",
    "qdrant",
    "neurodiversity",
    "universal-design-for-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent"
]

dependencies = [
    "flask>=3.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "PyMuPDF>=1.24.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0"
]
eval = [
    "sacremoses>=0.2.0",
    "evaluate>=0.4.0",
    "bert-score>=0.3.13",
    "sacrebleu>=2.4.0",
    "torch>=2.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["config", "agents", "services"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

